<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Book Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .container {
            max-width: 500px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        select {
            padding: 8px;
            width: 100%;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .book-details {
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #007bff;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Book Details Viewer</h2>
        
        <!-- Dropdown menu to select a book title -->
        <label for="bookSelect"><strong>Select a Book Title:</strong></label><br><br>
        <select id="bookSelect">
            <option value="">-- Choose a Book --</option>
        </select>

        <!-- Container to display selected book details -->
        <div id="displayArea" class="book-details" style="display: none;"></div>
    </div>

    <script>
        // Your actual Raw GitHub JSON URL
        const githubJsonUrl = 'https://raw.githubusercontent.com/nabilllaayla-glitch/BookRecords/refs/heads/main/book.json';

        let booksData = [];

        // Fetch JSON data from GitHub
        fetch(githubJsonUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                booksData = data.Books;
                populateSelectDropdown(booksData);
            })
            .catch(error => {
                console.error('Error fetching JSON from GitHub:', error);
                const displayArea = document.getElementById('displayArea');
                displayArea.style.display = 'block';
                displayArea.className = 'error';
                displayArea.innerText = 'Failed to load book records. Please check the GitHub URL.';
            });

        // Add book titles to dropdown
        function populateSelectDropdown(books) {
            const selectElement = document.getElementById('bookSelect');
            
            books.forEach(book => {
                const option = document.createElement('option');
                option.value = book.title;
                option.textContent = book.title;
                selectElement.appendChild(option);
            });
        }

        // Display book details when selected
        document.getElementById('bookSelect').addEventListener('change', function() {
            const selectedTitle = this.value;
            const displayArea = document.getElementById('displayArea');

            if (!selectedTitle) {
                displayArea.style.display = 'none';
                return;
            }

            const foundBook = booksData.find(book => book.title === selectedTitle);

            displayArea.style.display = 'block';

            if (foundBook) {
                displayArea.className = 'book-details';
                displayArea.innerHTML = `
                    <h3>${foundBook.title}</h3>
                    <p><strong>Author:</strong> ${foundBook.author}</p>
                    <p><strong>Publication Year:</strong> ${foundBook.publicationYear}</p>
                    <p><strong>Genre:</strong> ${Array.isArray(foundBook.genres) ? foundBook.genres.join(', ') : foundBook.genres}</p>
                `;
            } else {
                displayArea.className = 'error';
                displayArea.innerHTML = `<p>Book record not found.</p>`;
            }
        });
    </script>

</body>
</html>
