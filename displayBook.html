<!DOCTYPE html>
<html>
<head>
    <title>Book Records</title>
</head>
<body>

    <h1>Book Records</h1>

    <label for="bookSelect">Select a book:</label>
    <select id="bookSelect">
        <option value="">-- Select a Book --</option>
    </select>

    <div id="bookDetails"></div>

    <script>
        const jsonURL = "https://raw.githubusercontent.com/nabilllaayla-glitch/BookRecords/refs/heads/main/book.json";

        let books = [];

        fetch(jsonURL)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch JSON");
                }
                return response.json();
            })
            .then(data => {
                books = data.books;

                const select = document.getElementById("bookSelect");

                books.forEach((book, index) => {
                    const option = document.createElement("option");
                    option.value = index;
                    option.textContent = book.title;
                    select.appendChild(option);
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById("bookDetails").textContent =
                    "Unable to load book records.";
            });

        document.getElementById("bookSelect")
            .addEventListener("change", function () {
                const details = document.getElementById("bookDetails");

                if (this.value === "") {
                    details.innerHTML = "";
                    return;
                }

                const book = books[this.value];

                if (!book) {
                    details.textContent = "Book not found.";
                    return;
                }

                details.innerHTML = `
                    <h2>${book.title}</h2>
                    <p><b>Author:</b> ${book.author}</p>
                    <p><b>Publication Year:</b> ${book.publicationYear}</p>
                    <p><b>Genres:</b> ${book.genres.join(", ")}</p>
                `;
            });
    </script>

</body>
</html>
